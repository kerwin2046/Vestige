# Vestige Docker 栈
#
# 启动全部（SearXNG + Camofox）:
#   cd docker && docker compose --env-file ../.env --profile crawler up -d
#
# 仅 SearXNG（不需要 Camofox 时）:
#   cd docker && docker compose up -d
#
# 健康检查:
#   bash docker/check.sh

name: vestige

include:
  - path: ../searxng/docker-compose.yml
    project_directory: ../searxng

services:
  camofox:
    profiles: [crawler]
    container_name: vestige-camofox
    image: ghcr.io/jo-inc/camofox-browser:${CAMOFOX_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CAMOFOX_PORT:-9377}:9377"
    env_file:
      - ../.env
    tmpfs:
      - /tmp
    mem_limit: 2g
    cpus: 2
    pids_limit: 200
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9377/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
